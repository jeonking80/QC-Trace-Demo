# 빌드 → 단위·통합 테스트(Testcontainers SQL Server) → compose로 앱 기동 → Playwright E2E → 독립 대조
# CI가 환경 문제로 반복 실패하면 로컬 Docker에서 같은 명령을 돌려 결과를 기록한다(PLAN 7장).
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 빌드·단위·통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore QcTrace.sln
      - run: dotnet build QcTrace.sln --no-restore -c Release
      - name: 테스트 (규칙 R1~R10, 통합)
        run: dotnet test QcTrace.sln --no-build -c Release --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: test-results

  e2e:
    name: E2E·독립 대조
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 앱 기동 (docker compose)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/health > /dev/null; then echo "health OK"; break; fi
            sleep 5
          done
          curl -fs http://localhost:8080/health
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright 시나리오 3개
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 독립 대조 (원장 합으로 수량 재계산, 불일치 있으면 실패)
        run: dotnet run --project tools/Reconcile -c Release
      - name: 보고서 파일 생성 확인
        run: docker compose exec -T app sh -c 'ls -l /app/reports && ls /app/reports | grep -q "^qc-daily-"'
      - name: 앱 로그
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
