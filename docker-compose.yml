services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-QcTrace!Dev2026}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: /app/keys
      # 일일 엑셀 보고서 폴더(볼륨)와 생성 시각(한국 시간)
      Reports__Path: /app/reports
      Reports__RunAtKst: "08:00"
      # 관리자 연결: 시작할 때 마이그레이션·앱 계정 생성·시드에만 쓴다
      ConnectionStrings__QcTraceAdmin: "Server=db,1433;Database=QcTrace;User Id=sa;Password=${MSSQL_SA_PASSWORD:-QcTrace!Dev2026};TrustServerCertificate=True;Encrypt=True"
      # 앱 실행 연결: 최소 권한 계정. 수량·이력 테이블은 저장 프로시저로만 바뀐다
      ConnectionStrings__QcTrace: "Server=db,1433;Database=QcTrace;User Id=qctrace_app;Password=${QCTRACE_APP_PASSWORD:-QcTrace!App2026};TrustServerCertificate=True;Encrypt=True;Connect Timeout=5"
    ports:
      - "8080:8080"
    volumes:
      - dp-keys:/app/keys
      - reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
  dp-keys:
  reports:
